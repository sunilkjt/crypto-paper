# Deploys the Vite build to GitHub Pages on every push to main.
# One-time setup (in the GitHub repo): Settings → Pages → Source: "GitHub Actions".
# Site URL after deploy: https://sunilkjt.github.io/crypto-paper/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          # Publishable-only Supabase config for GitHub Pages (set as repo
          # secrets; NEVER put sb_secret_* / service_role here).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Gemini explanations backend (empty = local explainer fallback).
          VITE_AI_ENDPOINT: ${{ secrets.VITE_AI_ENDPOINT }}
          # Telegram delivery endpoint (empty = Not configured status).
          VITE_TELEGRAM_ENDPOINT: ${{ secrets.VITE_TELEGRAM_ENDPOINT }}
      # Headless entries must import cleanly under plain Node/tsx (no Vite
      # env injection). Runs credential-free; each entry must exit 2.
      - run: node scripts/smoke-entries.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
