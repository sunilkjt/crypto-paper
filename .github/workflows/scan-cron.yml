# Headless paper-signal scanner — MANUAL FALLBACK ONLY.
#
# The 24/7 trigger moved to Supabase pg_cron + pg_net invoking the
# signal-scan edge function every 5 minutes (migration 0010; Supabase
# infra, immune to GitHub schedule throttling and the 60-day auto-disable).
# This workflow keeps the SAME deterministic engine as a manual fallback:
# run it from Actions → "Paper signal cron" → Run workflow for backfills
# or while the pg_cron job is paused. No browser, no AI calls, no journal
# writes, no paper trades — notifications only.
#
# ONE-SCANNER RULE: never run this while pg_cron signal-scan-5min is
# active (or with an open browser scanner) — the atomic claim gate would
# suppress most duplicates, but two writers still churn state needlessly.
#
# Required repo secrets (Settings → Secrets → Actions — server-side only,
# NEVER prefixed VITE_, NEVER baked into any frontend bundle):
#   SUPABASE_URL              (same value as VITE_SUPABASE_URL)
#   SUPABASE_SERVICE_ROLE_KEY (Project Settings → API → service_role)
#   TELEGRAM_BOT_TOKEN        (same value as the Supabase secret)
#
# Tunables below (env): categories, minimum strength, cooldown, site URL.
# If this fallback itself keeps failing, check in order: missing secrets
# (exit 2 = env absent), Supabase reachability/table migrations (the error
# names the migration), Hyperliquid timeouts (transient — retry), and
# Actions being disabled on a fork (Settings → Actions → Allow all).

name: Paper signal cron

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-cron
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Hung runs must never block the queue forever (concurrency is
    # non-cancelling by design so overlapping scans serialize).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run scan:cron
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SITE_URL: https://sunilkjt.github.io/crypto-paper
          SCAN_CATEGORIES: crypto,stocks,commodities
          NOTIFY_MIN_STRENGTH: "70"
          NOTIFY_DIRECTIONS: LONG,SHORT
          NOTIFY_COOLDOWN_MINUTES: "30"
